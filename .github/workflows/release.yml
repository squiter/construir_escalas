name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Binary
    runs-on: windows-latest
    env:
      ImageOS: win22
      MIX_ENV: prod
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.15.7'
          otp-version: '26.2'

      - name: Install Zig
        run: |
          # Burrito 1.4.0 requires exactly Zig 0.14.1
          $zigVersion = "0.14.1"
          $zigUrl = "https://ziglang.org/download/$zigVersion/zig-windows-x86_64-$zigVersion.zip"
          $zigZip = "zig.zip"
          
          Write-Host "Downloading Zig $zigVersion from $zigUrl"
          Invoke-WebRequest -Uri $zigUrl -OutFile $zigZip -UseBasicParsing
          
          Write-Host "Extracting Zig..."
          Expand-Archive -Path $zigZip -DestinationPath . -Force
          
          $zigDir = Get-ChildItem -Directory | Where-Object { $_.Name -like "*zig*" } | Select-Object -First 1
          $zigPath = "$PWD\$($zigDir.Name)"
          
          $env:PATH = "$zigPath;$env:PATH"
          echo "$zigPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          
          Write-Host "Zig installed at: $zigPath"
          zig version

      - name: Install xz
        run: |
          # Use winget to install xz (GnuWin32 package)
          winget install --id=GnuWin32.XZ -e --silent --accept-package-agreements --accept-source-agreements
          # Add to PATH
          $xzPath = "$env:ProgramFiles\GnuWin32\bin"
          if (Test-Path $xzPath) {
            $env:PATH = "$xzPath;$env:PATH"
            echo "$xzPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            xz --version
          } else {
            Write-Host "xz installation path not found, checking alternative locations..."
            # Try common installation paths
            $altPaths = @(
              "$env:ProgramFiles(x86)\GnuWin32\bin",
              "$env:LOCALAPPDATA\Microsoft\WinGet\Packages\GnuWin32.XZ_Microsoft.Winget.Source_*\bin"
            )
            foreach ($path in $altPaths) {
              $resolved = Resolve-Path $path -ErrorAction SilentlyContinue
              if ($resolved) {
                $env:PATH = "$resolved;$env:PATH"
                echo "$resolved" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
                break
              }
            }
            xz --version
          }

      - name: Install dependencies
        run: mix deps.get

      - name: Compile dependencies
        run: mix deps.compile

      - name: Compile project
        run: mix compile

      - name: Build binary with Burrito
        run: mix release

      - name: Get version from tag
        id: get_version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $tag = "${{ github.ref }}".Replace("refs/tags/", "")
          $version = $tag.TrimStart('v')
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Get version from mix.exs
        id: get_version_mix
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: |
          $version = (Get-Content mix.exs | Select-String 'version: "([^"]+)"').Matches.Groups[1].Value
          $tag = "v$version"
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.tag || steps.get_version_mix.outputs.tag }}
          name: Release ${{ steps.get_version.outputs.tag || steps.get_version_mix.outputs.tag }}
          body: |
            Windows binary for Construir Escala ${{ steps.get_version.outputs.version || steps.get_version_mix.outputs.version }}
            
            ## Installation
            Download `construir_escala.exe` and run it from the command line.
            
            ## Usage
            ```
            construir_escala.exe YYYY-MM-DD [semanas]
            ```
          files: ./burrito_out/construir_escala.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

